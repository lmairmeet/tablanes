<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TabLanes</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand-name">TabLanes</span>
      </div>
      <div class="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" /><path d="m20 20-3.6-3.6" />
        </svg>
        <input id="search" type="search" placeholder="Search cards" autocomplete="off" spellcheck="false" />
        <kbd class="search-hint">/</kbd>
      </div>
      <p class="stats" id="stats" aria-live="polite"></p>
    </header>

    <main class="board" id="board" aria-label="Board"></main>

    <div class="toast-host" id="toast-host" aria-live="polite"></div>
    <dialog class="dialog" id="card-dialog" aria-label="Card details"></dialog>

    <script src="vendor/sql-wasm.js"></script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
